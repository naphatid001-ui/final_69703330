<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- Favicon-->
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
    <!-- Font Awesome icons (free version)-->
    <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
    <!-- Google fonts-->
    <link href="https://fonts.googleapis.com/css?family=Montserrat:400,700" rel="stylesheet" type="text/css" />
    <link href="https://fonts.googleapis.com/css?family=Lato:400,700,400italic,700italic" rel="stylesheet"
        type="text/css" />
    <!-- Core theme CSS (includes Bootstrap)-->
    <link href="css/styles.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body id="page-top">

    <!-- Navbar -->
    <div id="menu"></div>

    <div style="height: 100px;"></div>

    <div class="container pt-5 " id="Register">
        <form id="form1">
        <div class="row ">
            <div class="col-md-6 mx-auto mt-6 bg-light   rounded">
                <div class="h3 text-center	text-primary mt-3 ">Register</div>
                <div class="mb-3 mt-4 ">
                    <label class="form-label">Firstname - Lastname</label>
                    <input type="text" class="form-control" id="firstname-lastname" placeholder="firstname - lastname" required>
                </div>
                <div class="mb-3 mt-4 ">
                    <label class="form-label">Email address</label>
                    <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                </div>
                <div class="mb-3 mt-4 ">    
                    <label class="form-label">Username</label>
                    <input type="text" class="form-control" id="Username" placeholder="Username" required>
                </div>
                <div class="mb-3 mt-4 ">
                    <label class="form-label">Password</label>
                    <input type="Password" class="form-control" id="Password" placeholder="Password" required>
                </div>
                <div class="mb-3">
                  <label class="form-label">province</label>
                  <select class="form-select" id="province" required>
                    <option selected>Course</option>
                    <option value="1">Course 1</option>
                    <option value="2">Course 2</option>
                    <option value="3">Course 3</option>
                    <option value="3">Course 4</option>
                    <option value="3">Course 5</option>
                    <option value="3">Course 6</option>
                  </select>
                </div>
                <div class="text-center mb-4">
                    <input type="submit" id="submit" class="btn btn-primary" value="Submit">
                    <input type="reset" id="reset" class="btn btn-danger" value="Cancel">
                </div>
            </div>
        </div>
        </form>
    </div>

    <div style="height: 150px;"></div>

    <!-- Footer-->
    <div id="footer"></div>
</body>
</html>

<script src="js/menu.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.startbootstrap.com/sb-forms-latest.js"></script>
